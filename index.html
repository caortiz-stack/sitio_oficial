<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Christian Ortiz | Sitio Oficial</title>
    
    <!-- Fuentes originales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@100;200;400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Original -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cormorant Garamond', 'serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            dark: '#050505',
                            light: '#e8dbce',
                            accent: '#d97014',
                            twitch: '#9146ff'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --b-dark: #050505;
            --b-light: #e8dbce;
            --b-accent: #d97014;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--b-dark);
            color: var(--b-light);
            -webkit-font-smoothing: antialiased;
            overflow: hidden; /* Prohíbe totalmente el scroll */
            overscroll-behavior: none; /* Evita el rebote en pantallas táctiles */
            
            /* Bloqueo total de selección y copia de texto */
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */
            user-select: none; /* Estándar */
            cursor: default; /* Fuerza el cursor de flecha estándar en lugar del de texto */
        }

        /* Ocultar barra de desplazamiento visualmente pero permitiendo el scroll en modales y en el slider móvil */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #dynamic-bg {
            position: fixed;
            inset: -20%;
            width: 140%;
            height: 140%;
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.15) saturate(0.8) sepia(0.3);
            transition: opacity 1.5s ease-in-out, background-image 1.5s ease-in-out;
            z-index: -2;
            pointer-events: none;
            opacity: 0;
        }

        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, #050505 100%);
            pointer-events: none;
            z-index: -1;
        }

        .film-grain {
            position: fixed;
            inset: 0;
            opacity: 0.04;
            pointer-events: none;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- EFECTOS EXCLUSIVOS DE ESCRITORIO (PC/TV) --- */
        @media (min-width: 768px) {
            .card-hover {
                transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            }
            /* La magia del :has() -> Solo opaca las demás si hay una tarjeta ESPECÍFICAMENTE siendo apuntada. 
               Pasar el ratón por un hueco vacío de la cuadrícula no hará nada. */
            #catalog-grid:has(.card-hover:hover) .card-hover:not(:hover) {
                opacity: 0.2;
                filter: blur(2px) grayscale(60%) sepia(50%);
                transform: scale(0.96);
            }
            .card-hover:hover {
                transform: scale(1.02);
                z-index: 10;
            }
        }

        /* --- EFECTOS EXCLUSIVOS DE SLIDER PARA MÓVIL --- */
        @media (max-width: 767px) {
            .mobile-slide {
                opacity: 0.35;
                transform: scale(0.85);
                filter: grayscale(60%) sepia(30%);
                transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .mobile-slide.is-active {
                opacity: 1;
                transform: scale(1);
                filter: grayscale(0%) sepia(0%);
                z-index: 20;
            }
            /* Forzar el Hover cuando la tarjeta se centra en el celular */
            .mobile-slide.is-active img {
                filter: sepia(0) brightness(0.9) saturate(1) !important;
                transform: scale(1.03) !important;
            }
            .mobile-slide.is-active .group-hover\:opacity-50 { opacity: 0.5 !important; }
            .mobile-slide.is-active .group-hover\:opacity-100 { opacity: 1 !important; }
            .mobile-slide.is-active .group-hover\:translate-y-0 { transform: translateY(0) !important; }
            .mobile-slide.is-active .group-hover\:text-white { color: #ffffff !important; }
            .mobile-slide.is-active .group-hover\:text-brand-accent { color: var(--b-accent) !important; }
            .mobile-slide.is-active .group-hover\:shadow-\[0_25px_50px_rgba\(217\,112\,20\,0\.15\)\] {
                box-shadow: 0 25px 50px rgba(217, 112, 20, 0.15) !important;
            }
            .mobile-slide.is-active .group-hover\:ring-brand-accent\/30 {
                --tw-ring-color: rgba(217, 112, 20, 0.3) !important;
                box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow) !important;
            }
        }

        .fade-in {
            opacity: 0;
            animation: fadeInAnim 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes fadeInAnim {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar-fill {
            transition: width 0.1s linear;
        }
        
        .text-glow {
            text-shadow: 0 0 15px rgba(217, 112, 20, 0.4);
        }

        /* --- CSS Original de la Cabecera --- */
        .lt { position: fixed; top: 0; left: 0; right: 0; height: 10vh; background: #050505; z-index: 500; display: flex; justify-content: space-between; align-items: center; padding: 0 4rem; border-bottom: 1px solid rgba(255,255,255,.03); box-shadow: 0 10px 30px rgba(0,0,0,.8); }
        .bc { text-align: center; font-family: 'Playfair Display', serif; font-size: clamp(1.5rem,2vw,2rem); letter-spacing: 3px; text-transform: uppercase; }
        .bc .ip { font-style: italic; font-weight: 400; margin-right: 8px; color: #e8dbce; }
        .bc .bp { color: var(--b-accent); font-weight: 700; }
        .nt { font-family: 'JetBrains Mono', monospace; font-size: .6rem; letter-spacing: .4em; text-transform: uppercase; color: rgba(244,236,216,.5); flex: 1; }
        .sc { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 1.5rem; }
        .sc a { color: #fff; font-size: 1.1rem; transition: all .3s; }
        .sc a:hover { color: var(--b-accent); transform: translateY(-2px); }
        .tb { display: flex; align-items: center; gap: 8px; background: rgba(145,70,255,.15); border: 1px solid #9146ff; padding: 4px 12px; border-radius: 100px; text-decoration: none!important; transition: all .3s ease; margin-right: 5px; }
        .tb:hover { background: #9146ff; transform: scale(1.05); }
        .tb span { font-family: 'JetBrains Mono', monospace; font-size: .55rem; font-weight: 700; color: #fff; letter-spacing: .1em; text-transform: uppercase; }
        .ld { width: 6px; height: 6px; background-color: #fff; border-radius: 50%; position: relative; }
        .ld::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid #fff; animation: lp 1.5s infinite; }
        @keyframes lp { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        
        @media (max-width: 1024px) {
            .nt, .sc { display: none; }
            .lt { justify-content: center; padding: 0; }
        }
    </style>
</head>

        <!-- CONTENEDOR HÍBRIDO -->
        <div class="flex flex-row overflow-x-auto snap-x snap-mandatory no-scrollbar items-center gap-6 px-[12vw] w-full h-full max-w-[1400px] md:grid md:grid-cols-3 md:grid-rows-2 md:gap-x-12 md:gap-y-6 md:px-0 md:items-stretch md:overflow-visible md:snap-none" id="catalog-grid">

        <div class="h-[2px] w-full bg-white/5 relative cursor-pointer group" id="progress-container">

            <div class="md:hidden flex items-center justify-end flex-1">

    <!-- Modal de Lista de Canciones -->
    <div id="tracklist-modal" class="fixed inset-0 z-[2000] flex items-center justify-center bg-brand-dark/95 backdrop-blur-xl opacity-0 pointer-events-none transition-opacity duration-700" onclick="App.closeModal()">

        <div class="bg-transparent border border-white/5 p-6 md:p-10 w-[500px] max-w-[90vw] max-h-[80vh] flex flex-col shadow-[0_30px_100px_rgba(0,0,0,1)] relative transform scale-95 transition-transform duration-700" id="tracklist-content-box" onclick="event.stopPropagation()">
            
            <div class="text-center mb-6 md:mb-8 border-b border-white/5 pb-4 md:pb-6">

            <div class="overflow-y-auto no-scrollbar flex-grow mb-6 md:mb-8 pr-2 relative" id="modal-track-list">

            <button onclick="App.closeModal()" class="bg-transparent border border-white/20 text-white/70 font-mono text-[0.45rem] md:text-[0.5rem] tracking-[0.3em] uppercase py-3 md:py-4 px-4 transition-all duration-300 hover:bg-white hover:text-black w-full mt-auto">
                Volver al Catálogo
            </button>
        </div>
    </div>

    <script>
        const catalogData = [
            { id: "824296029053", title: "Tú Me Enloqueces", year: "2026", type: "SENCILLO", links: { spotify: "https://open.spotify.com/album/5R2XPFYEVBHtJNo3EHbIjb", apple: "https://geo.itunes.apple.com/ec/album/t%C3%BA-me-enloqueces-single/1886160176", youtube: "https://music.youtube.com/playlist?list=OLAK5uy_kgUrR6uATOmO0x9KAwXZEn28J3OsoNN78" }},
            { id: "199891494026", title: "Nació en Abril, se llama Rosa", year: "2026", type: "SENCILLO", links: { spotify: "https://open.spotify.com/album/4twyW3FYzetjGSalnoZbAa", apple: "https://geo.music.apple.com/us/album/naci%C3%B3-en-abril-se-llama-rosa-single/1872957906", youtube: "https://music.youtube.com/playlist?list=OLAK5uy_mf2Qk4l5IFOGIcJClyae3MoXfBU7BUPl4" }},
            { id: "199891861989", title: "La Ocasión Hizo al Ladrón", year: "2026", type: "SENCILLO", links: { spotify: "https://open.spotify.com/album/4dIZqy3rcrh8PiQjvDAwjP", apple: "https://geo.itunes.apple.com/ec/album/la-ocasi%C3%B3n-hizo-al-ladr%C3%B3n-single/1882038438", youtube: "https://music.youtube.com/playlist?list=OLAK5uy_lEUFjZ7H079RDWgp7-DNvhu40_6uj3bBQ" }},
            { id: "199891455157", title: "Eternamente", year: "2026", type: "EP", links: { spotify: "https://open.spotify.com/album/5JH35nNMrSdnoRUqgzM57Y", apple: "https://geo.music.apple.com/us/album/eternamente/1873770285", youtube: "https://music.youtube.com/playlist?list=OLAK5uy_liQBD3glqo6KKoxVIGWSdRgzW3lQ7_2vI" }},
            { id: "713312376526", title: "Boleto para Pasear", year: "2023", type: "SENCILLO", links: { spotify: "https://open.spotify.com/album/6QyQQuYjPu8xTtfAzoR9Ep", apple: "https://music.apple.com/ec/album/boleto-para-pasear-single/1669136008", youtube: "https://music.youtube.com/playlist?list=OLAK5uy_kjUYSfQO6m8ATeJ26125JprTmh1oMFDUE" }},
            { id: "793420571747", title: "A Él", year: "2020", type: "SENCILLO", links: { spotify: "https://open.spotify.com/intl-es/album/0R2LWKPm9mVxub2goSA8mn", apple: "https://geo.itunes.apple.com/ec/album/a-%C3%A8l-single/1503364891", youtube: "https://music.youtube.com/playlist?list=OLAK5uy_l_XRyjvBjgnyCqXasQdscAMOMqcBYgxw4" }}
        ];

        const App = {
            audioElements: [new Audio(), new Audio()], // Sistema Dual-Audio para el Crossfade
            itunesData: {},
            state: { currentAlbumId: null, currentTrackIndex: -1, isPlaying: false, fadeFrames: [null, null], animationFrameId: null, isFadingOut: false, activeAudioIndex: 0 },

            get currentAudio() {
                return this.audioElements[this.state.activeAudioIndex];
            },

            init() {
                this.audioElements.forEach(a => a.volume = 0);
                this.setupEventListeners();
                this.renderGridSkeletons();
                this.fetchITunesData();
                this.checkTwitchStatus();
                setInterval(() => this.checkTwitchStatus(), 60000);
                this.animationLoop();
            },

            setupEventListeners() {
                this.audioElements.forEach((audio, index) => {
                    audio.addEventListener('loadedmetadata', () => {
                        if (this.state.activeAudioIndex === index) {
                            document.getElementById('time-total').innerText = this.formatTime(audio.duration);
                        }
                    });
                    
                    audio.addEventListener('ended', () => {
                        if (this.state.activeAudioIndex === index) {
                            this.state.isFadingOut = false;
                            this.nextTrack();
                        }
                    });
                });

                const progressContainer = document.getElementById('progress-container');
                progressContainer.addEventListener('click', (e) => {
                    const audio = this.currentAudio;
                    if (!audio.src) return;
                    const rect = progressContainer.getBoundingClientRect();
                    const percent = Math.min(Math.max(0, e.clientX - rect.left), rect.width) / rect.width;
                    audio.currentTime = percent * audio.duration;
                });
            },
            
            animationLoop() {
                const audio = this.currentAudio;
                if (audio.duration && !isNaN(audio.currentTime)) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    document.getElementById('progress-bar').style.width = `${percent}%`;
                    document.getElementById('progress-handle').style.left = `${percent}%`;
                    document.getElementById('time-current').innerText = this.formatTime(audio.currentTime);
                    
                    const timeLeft = audio.duration - audio.currentTime;
                    // Auto-Fade Out para el final natural de la canción
                    if (timeLeft <= 2.5 && timeLeft > 0 && !this.state.isFadingOut && this.state.isPlaying) {
                        this.state.isFadingOut = true;
                        this.fadeAudio(audio, 'out', null, false);
                    }
                }
                this.state.animationFrameId = requestAnimationFrame(() => this.animationLoop());
            },

            fadeAudio(audioElement, type, callback, pauseAtEnd = true, customDuration = null) {
                const index = this.audioElements.indexOf(audioElement);
                if (this.state.fadeFrames[index]) cancelAnimationFrame(this.state.fadeFrames[index]);
                
                const duration = customDuration || (type === 'out' ? 2500 : 1500); 
                const maxVol = 0.5; 
                const initialVol = type === 'out' ? audioElement.volume : 0;
                
                if (type === 'in') {
                    if (index === this.state.activeAudioIndex) this.updatePlayState(true); 
                    audioElement.volume = 0;
                    audioElement.play().catch(e => console.error(e));
                } else if (type === 'out' && pauseAtEnd) {
                    if (index === this.state.activeAudioIndex) this.updatePlayState(false); 
                }

                const startTime = performance.now();

                const animateFade = (currentTime) => {
                    const elapsed = currentTime - startTime;
                    let progress = Math.max(0, Math.min(elapsed / duration, 1));
                    
                    let newVol;
                    if (type === 'in') {
                        newVol = maxVol * progress;
                    } else {
                        newVol = initialVol * Math.pow(1 - progress, 2.5);
                    }

                    audioElement.volume = Math.max(0, Math.min(1, newVol));

                    if (progress < 1) {
                        this.state.fadeFrames[index] = requestAnimationFrame(animateFade);
                    } else {
                        if (type === 'out') {
                            audioElement.volume = 0;
                            if (pauseAtEnd) audioElement.pause();
                        } else {
                            audioElement.volume = maxVol;
                        }
                        if (callback) callback();
                    }
                };

                this.state.fadeFrames[index] = requestAnimationFrame(animateFade);
            },

            initMobileSlider() {
                if (window.innerWidth >= 768) return;

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-active');
                            const albumId = entry.target.id.replace('card-', '');
                            const data = this.itunesData[albumId];
                            
                            if (data && !this.state.isPlaying) {
                                document.getElementById('dynamic-bg').style.backgroundImage = `url('${data.artwork}')`;
                                document.getElementById('dynamic-bg').style.opacity = '0.7';
                            }
                        } else {
                            entry.target.classList.remove('is-active');
                        }
                    });
                }, {
                    root: document.getElementById('catalog-grid'),
                    threshold: 0.6 // Se activa cuando el 60% de la tarjeta está visible en el centro
                });

                document.querySelectorAll('.mobile-slide').forEach(slide => observer.observe(slide));
            },

            renderGridSkeletons() {
                const grid = document.getElementById('catalog-grid');
                grid.innerHTML = catalogData.map((album, index) => `
                    <article class="mobile-slide flex flex-col items-center justify-center w-[76vw] h-auto flex-shrink-0 snap-center md:w-full md:h-full md:min-h-0 md:min-w-0 md:flex-shrink md:snap-none fade-in" style="animation-delay: ${index * 0.2}s;" id="card-${album.id}">
                        
                        <!-- ESTE WRAPPER DEFINE EL HITBOX EXACTO (w-fit en PC, w-full en Móvil) -->
                        <div id="hover-target-${album.id}" class="card-hover group flex flex-col items-center justify-center w-full md:w-fit md:h-full">
                            
                            <!-- Contenedor Portada + Redes Absolutas -->
                            <!-- CORRECCIÓN MÓVIL: w-full flex-shrink-0 forza a la carátula a mantener su espacio físico y no aplastar los textos -->
                            <div class="w-full flex-shrink-0 flex items-center justify-center relative md:flex-1 md:min-h-0">
                                <div class="relative w-full aspect-square transition-all duration-700 md:w-auto md:h-full md:aspect-square">
                                    
                                    <!-- Contenedor Portada (Corte exacto) -->
                                    <div class="absolute inset-0 bg-black overflow-hidden shadow-[0_15px_30px_rgba(0,0,0,0.9)] ring-1 ring-white/5 group-hover:ring-brand-accent/30 group-hover:shadow-[0_25px_50px_rgba(217,112,20,0.15)] rounded-sm">
                                        <img id="img-${album.id}" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMwZDBhMDgiLz48L3N2Zz4=" alt="${album.title}" class="absolute inset-0 w-full h-full object-cover filter sepia-[0.4] brightness-[0.5] contrast-125 saturate-[0.8] transition-all duration-1000 opacity-0 group-hover:sepia-0 group-hover:brightness-90 group-hover:saturate-100 group-hover:scale-[1.03]">
                                        
                                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_40%,rgba(0,0,0,0.6)_120%)] pointer-events-none transition-opacity duration-1000 group-hover:opacity-50"></div>

                                        <div class="absolute inset-0 flex flex-col items-center justify-center gap-2 md:gap-4 opacity-0 group-hover:opacity-100 transition-opacity duration-700 z-20">
                                            <button onclick="App.playAlbumMain('${album.id}')" class="w-10 h-10 md:w-16 md:h-16 border-[1px] border-white/30 rounded-full flex items-center justify-center text-white bg-black/40 backdrop-blur-md hover:border-brand-accent hover:bg-brand-accent hover:text-brand-dark transition-all duration-500 hidden transform translate-y-4 group-hover:translate-y-0 shadow-lg" id="btn-play-${album.id}">
                                                <i class="fas fa-play ml-1 text-sm md:text-xl"></i>
                                            </button>
                                            <button onclick="App.openModal('${album.id}')" class="px-3 py-1.5 md:px-5 md:py-2.5 border-[1px] border-white/30 rounded-full text-white bg-black/40 backdrop-blur-md font-mono text-[0.45rem] md:text-[0.55rem] tracking-[0.2em] uppercase hover:border-brand-accent hover:bg-brand-accent hover:text-brand-dark transition-all duration-500 hidden transform translate-y-4 group-hover:translate-y-0 shadow-lg" id="btn-list-${album.id}">
                                                <i class="fas fa-list mr-1.5 opacity-80"></i> TRACKLIST
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Redes Laterales Blancas -->
                                    <div class="absolute -right-8 md:-right-[3.25rem] top-1/2 -translate-y-1/2 flex flex-col gap-2 md:gap-3 flex-shrink-0 z-30 opacity-80 group-hover:opacity-100 transition-opacity">
                                        ${album.links.spotify !== undefined ? `<a href="${album.links.spotify || '#'}" target="_blank" class="w-6 h-6 md:w-8 md:h-8 rounded-full border border-white/40 text-white flex items-center justify-center text-[0.55rem] md:text-xs hover:bg-white hover:text-black hover:border-white transition-all"><i class="fab fa-spotify"></i></a>` : ''}
                                        ${album.links.apple !== undefined ? `<a href="${album.links.apple || '#'}" target="_blank" class="w-6 h-6 md:w-8 md:h-8 rounded-full border border-white/40 text-white flex items-center justify-center text-[0.55rem] md:text-xs hover:bg-white hover:text-black hover:border-white transition-all"><i class="fab fa-apple"></i></a>` : ''}
                                        ${album.links.youtube !== undefined ? `<a href="${album.links.youtube || '#'}" target="_blank" class="w-6 h-6 md:w-8 md:h-8 rounded-full border border-white/40 text-white flex items-center justify-center text-[0.55rem] md:text-xs hover:bg-white hover:text-black hover:border-white transition-all"><i class="fab fa-youtube"></i></a>` : ''}
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Info Abajo -->
                            <div class="w-full flex-shrink-0 flex flex-col items-center text-center mt-2 md:mt-4 px-1">
                                <h3 class="font-serif italic text-sm md:text-lg lg:text-xl text-brand-light/90 truncate w-full group-hover:text-white transition-colors">${album.title}</h3>
                                <p class="font-mono text-[0.45rem] md:text-[0.55rem] text-brand-light/40 tracking-[0.1em] md:tracking-[0.3em] mt-1 group-hover:text-brand-accent/80 transition-colors">${album.year} <span class="mx-1 md:mx-2">|</span> ${album.type}</p>
                            </div>
                            
                        </div>
                    </article>
                `).join('');
                
                setTimeout(() => this.initMobileSlider(), 100);
            },

            fetchITunesData() {
                const script = document.createElement('script');
                const callbackName = 'itunesCB_' + Date.now();
                window[callbackName] = (data) => {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    this.processItunesData(data);
                };
                script.src = `https://itunes.apple.com/lookup?id=1498747143&entity=song&limit=200&callback=${callbackName}`;
                script.onerror = () => this.handleItunesError();
                document.body.appendChild(script);
            },

            normalizeString(str) {
                return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            },

            processItunesData(data) {
                if (!data || !data.results) return this.handleItunesError();
                const collections = {};
                data.results.filter(r => r.wrapperType === 'track').forEach(track => {
                    const colId = track.collectionId;
                    if (!collections[colId]) {
                        collections[colId] = { name: track.collectionName, artwork: track.artworkUrl100.replace('100x100bb', '800x800bb'), tracks: [] };
                    }
                    collections[colId].tracks.push({ title: track.trackName, preview: track.previewUrl });
                });

                catalogData.forEach(localAlbum => {
                    const normLocalTitle = this.normalizeString(localAlbum.title);
                    let matchedData = null;
                    for (let key in collections) {
                        if (this.normalizeString(collections[key].name).includes(normLocalTitle)) {
                            matchedData = collections[key]; break;
                        }
                    }

                    const imgEl = document.getElementById(`img-${localAlbum.id}`);
                    const btnPlay = document.getElementById(`btn-play-${localAlbum.id}`);
                    const btnList = document.getElementById(`btn-list-${localAlbum.id}`);

                    if (matchedData) {
                        this.itunesData[localAlbum.id] = matchedData;
                        imgEl.src = matchedData.artwork;
                        imgEl.onload = () => imgEl.style.opacity = '1';

                        const validTracks = matchedData.tracks.filter(t => t.preview);
                        
                        if (validTracks.length > 0) btnPlay.classList.remove('hidden');
                        if (matchedData.tracks.length > 1) btnList.classList.remove('hidden');

                        // Lógica del hover de fondo dinámico atada AL WRAPPER EXACTO DE LA PORTADA
                        const hoverEl = document.getElementById(`hover-target-${localAlbum.id}`);
                        
                        hoverEl.addEventListener('mouseenter', () => {
                            if (window.innerWidth >= 768 && !this.state.isPlaying) {
                                document.getElementById('dynamic-bg').style.backgroundImage = `url('${matchedData.artwork}')`;
                                document.getElementById('dynamic-bg').style.opacity = '0.7';
                            }
                        });
                        
                        hoverEl.addEventListener('mouseleave', () => {
                             if (window.innerWidth >= 768 && !this.state.isPlaying) {
                                 document.getElementById('dynamic-bg').style.opacity = '0';
                             }
                        });

                    } else {
                        imgEl.src = `https://placehold.co/800x800/0d0a08/e8dbce?text=${encodeURIComponent(localAlbum.title)}`;
                        imgEl.onload = () => imgEl.style.opacity = '1';
                    }
                });
            },

            handleItunesError() {
                catalogData.forEach(album => {
                    const imgEl = document.getElementById(`img-${album.id}`);
                    imgEl.src = `https://placehold.co/800x800/0d0a08/e8dbce?text=${encodeURIComponent(album.title)}`;
                    imgEl.onload = () => imgEl.style.opacity = '1';
                });
            },

            showPlayer() {
                document.getElementById('global-player').classList.remove('translate-y-full');
                document.getElementById('main-content').classList.remove('h-[90vh]');
                document.getElementById('main-content').classList.add('h-[80vh]');
            },

            closePlayer() {
                this.pause();
                document.getElementById('global-player').classList.add('translate-y-full');
                document.getElementById('main-content').classList.remove('h-[80vh]');
                document.getElementById('main-content').classList.add('h-[90vh]');
                
                this.state.currentAlbumId = null;
                this.state.currentTrackIndex = -1;
                this.updatePlayState(false);
                setTimeout(() => {
                    this.audioElements.forEach(a => {
                        a.currentTime = 0;
                        a.pause();
                    });
                    document.getElementById('progress-bar').style.width = '0%';
                    document.getElementById('progress-handle').style.left = '0%';
                    document.getElementById('time-current').innerText = '0:00';
                }, 700);
            },

            playAlbumMain(albumId) {
                if (this.state.currentAlbumId === albumId && this.state.isPlaying) return this.pause();
                const data = this.itunesData[albumId];
                if (!data) return;
                const firstValidIndex = data.tracks.findIndex(t => t.preview);
                if (firstValidIndex !== -1) this.playTrack(albumId, firstValidIndex);
            },

            playTrack(albumId, trackIndex) {
                const data = this.itunesData[albumId];
                if (!data || !data.tracks[trackIndex] || !data.tracks[trackIndex].preview) return;
                
                this.state.isFadingOut = false;
                
                const prevAudio = this.currentAudio;
                const wasPlaying = this.state.isPlaying || (!prevAudio.paused && prevAudio.volume > 0);
                
                this.state.activeAudioIndex = 1 - this.state.activeAudioIndex;
                const nextAudio = this.currentAudio;

                nextAudio.src = data.tracks[trackIndex].preview;
                this.state.currentAlbumId = albumId;
                this.state.currentTrackIndex = trackIndex;

                this.updatePlayerUI(albumId, trackIndex);
                this.showPlayer();
                
                if (wasPlaying) {
                    this.fadeAudio(prevAudio, 'out', null, true, 1500);
                }
                
                this.fadeAudio(nextAudio, 'in', null, false, 1500);
            },

            pause() { 
                this.state.isFadingOut = true;
                this.fadeAudio(this.currentAudio, 'out', () => { this.state.isFadingOut = false; }, true); 
            },
            
            togglePlay() {
                const audio = this.currentAudio;
                if (!audio.src) return;
                this.state.isPlaying ? this.pause() : this.fadeAudio(audio, 'in');
            },

            nextTrack() {
                if (!this.state.currentAlbumId) return;
                const tracks = this.itunesData[this.state.currentAlbumId].tracks;
                let nextIdx = this.state.currentTrackIndex + 1;
                while (nextIdx < tracks.length) {
                    if (tracks[nextIdx].preview) return this.playTrack(this.state.currentAlbumId, nextIdx);
                    nextIdx++;
                }
                
                this.state.isFadingOut = false;
                this.closePlayer();
            },

            prevTrack() {
                if (!this.state.currentAlbumId) return;
                if (this.currentAudio.currentTime > 3) { 
                    this.state.isFadingOut = true;
                    this.fadeAudio(this.currentAudio, 'out', () => {
                        this.state.isFadingOut = false;
                        this.currentAudio.currentTime = 0;
                        this.fadeAudio(this.currentAudio, 'in');
                    }, true, 1000); 
                    return; 
                }
                const tracks = this.itunesData[this.state.currentAlbumId].tracks;
                let prevIdx = this.state.currentTrackIndex - 1;
                while (prevIdx >= 0) {
                    if (tracks[prevIdx].preview) return this.playTrack(this.state.currentAlbumId, prevIdx);
                    prevIdx--;
                }
                this.currentAudio.currentTime = 0;
            },

            updatePlayerUI(albumId, trackIndex) {
                const data = this.itunesData[albumId];
                document.getElementById('player-track').innerText = data.tracks[trackIndex].title;
                document.getElementById('player-album').innerText = data.name;
                document.getElementById('player-art').src = data.artwork;
                document.getElementById('dynamic-bg').style.backgroundImage = `url('${data.artwork}')`;
                document.getElementById('dynamic-bg').style.opacity = '0.7';
                this.updateModalPlayIcons();
                this.updateGridPlayIcons();
            },

            updatePlayState(playing) {
                this.state.isPlaying = playing;
                const icon = document.getElementById('icon-play-pause');
                if (playing) {
                    icon.className = 'fas fa-pause text-sm md:text-base';
                } else {
                    icon.className = 'fas fa-play ml-1 text-sm md:text-base';
                    document.getElementById('dynamic-bg').style.opacity = '0';
                }
                this.updateModalPlayIcons();
                this.updateGridPlayIcons();
            },

            formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            },

            updateGridPlayIcons() {
                catalogData.forEach(album => {
                    const btnIcon = document.querySelector(`#btn-play-${album.id} i`);
                    if (!btnIcon) return;
                    if (this.state.currentAlbumId === album.id && this.state.isPlaying) {
                        btnIcon.className = 'fas fa-pause text-sm md:text-xl text-brand-accent';
                        btnIcon.parentElement.classList.add('border-brand-accent');
                    } else {
                        btnIcon.className = 'fas fa-play ml-1 text-sm md:text-xl';
                        btnIcon.parentElement.classList.remove('border-brand-accent');
                    }
                });
            },

            openModal(albumId) {
                const data = this.itunesData[albumId];
                if (!data) return;
                document.getElementById('modal-album-title').innerText = data.name;
                
                document.getElementById('modal-track-list').innerHTML = data.tracks.map((track, index) => {
                    const hasPreview = !!track.preview;
                    const isPlayingThis = (this.state.currentAlbumId === albumId && this.state.currentTrackIndex === index && this.state.isPlaying);
                    const iconClass = isPlayingThis ? 'fa-pause' : (hasPreview ? 'fa-play' : 'fa-ban');
                    const textClass = isPlayingThis ? 'text-brand-accent italic' : (hasPreview ? 'text-white/80 hover:text-white' : 'text-white/20 line-through');
                    
                    const trackNum = (index + 1).toString().padStart(2, '0');

                    return `
                        <div class="flex justify-between items-center py-3 md:py-4 px-2 border-b border-white/5 font-serif text-sm md:text-lg transition-all duration-300 hover:bg-white/5 group ${hasPreview ? 'cursor-pointer' : ''}" 
                             ${hasPreview ? `onclick="App.playTrack('${albumId}', ${index})"` : ''}>
                            <div class="flex items-center gap-3 md:gap-4 truncate">
                                <span class="font-mono text-[0.45rem] md:text-[0.55rem] text-white/30 tracking-widest">${trackNum}</span>
                                <span class="truncate ${textClass} transition-colors duration-300">${track.title}</span>
                            </div>
                            <button class="${isPlayingThis ? 'text-brand-accent' : 'text-white/20'} group-hover:text-brand-accent transition-colors duration-300 p-2">
                                <i id="modal-icon-${albumId}-${index}" class="fas ${iconClass} text-xs md:text-sm"></i>
                            </button>
                        </div>
                    `;
                }).join('');
                
                const modal = document.getElementById('tracklist-modal');
                const content = document.getElementById('tracklist-content-box');
                modal.classList.remove('pointer-events-none', 'opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            },

            closeModal() {
                const modal = document.getElementById('tracklist-modal');
                const content = document.getElementById('tracklist-content-box');
                modal.classList.add('pointer-events-none', 'opacity-0');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
            },

            updateModalPlayIcons() {
                if (!this.state.currentAlbumId) return;
                const data = this.itunesData[this.state.currentAlbumId];
                if(!data) return;
                data.tracks.forEach((track, index) => {
                    const iconEl = document.getElementById(`modal-icon-${this.state.currentAlbumId}-${index}`);
                    if (iconEl) {
                        const isPlayingThis = (this.state.currentTrackIndex === index && this.state.isPlaying);
                        iconEl.className = `fas ${isPlayingThis ? 'fa-pause text-xs md:text-sm' : (track.preview ? 'fa-play text-xs md:text-sm' : 'fa-ban text-xs md:text-sm')}`;
                        iconEl.parentElement.className = `${isPlayingThis ? 'text-brand-accent' : 'text-white/20'} group-hover:text-brand-accent transition-colors duration-300 p-2`;
                        
                        const textSpan = iconEl.parentElement.previousElementSibling.querySelector('span:nth-child(2)');
                        if (isPlayingThis) {
                            textSpan.className = `truncate text-brand-accent italic transition-colors duration-300`;
                        } else if (track.preview) {
                            textSpan.className = `truncate text-white/80 group-hover:text-white transition-colors duration-300`;
                        }
                    }
                });
            },

            async checkTwitchStatus() {
                const badge = document.getElementById('tlb');
                if (!badge) return;
                try {
                    const response = await fetch(`https://decapi.me/twitch/is_live/imeachsd?t=${Date.now()}`);
                    if (!response.ok) throw new Error();
                    const text = await response.text();
                    if (text.trim().toLowerCase() === 'true') {
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                } catch (e) { badge.classList.add('hidden'); }
            }
        };

        window.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
